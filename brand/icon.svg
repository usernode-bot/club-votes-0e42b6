<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FFFEEA"/>
  <!-- three raised hands, drawn first so they sit behind the box -->
  <rect x="262" y="330" width="120" height="260" rx="60" fill="#000000"/>
  <rect x="452" y="240" width="120" height="350" rx="60" fill="#000000"/>
  <rect x="642" y="330" width="120" height="260" rx="60" fill="#000000"/>
  <!-- one small thumb capsule per hand -->
  <rect x="261" y="290" width="48" height="150" rx="24" fill="#000000" transform="rotate(-25 285 440)"/>
  <rect x="528" y="250" width="48" height="150" rx="24" fill="#000000" transform="rotate(18 552 400)"/>
  <rect x="716" y="290" width="48" height="150" rx="24" fill="#000000" transform="rotate(25 740 440)"/>
  <!-- cream gap so the hands stay separate from the box at small sizes -->
  <rect x="176" y="492" width="672" height="364" rx="56" fill="#FFFEEA"/>
  <!-- ballot box -->
  <rect x="200" y="516" width="624" height="316" rx="44" fill="#000000"/>
  <!-- slot -->
  <rect x="382" y="586" width="260" height="40" rx="20" fill="#FFFEEA"/>
</svg>
